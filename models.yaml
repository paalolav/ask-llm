# ask-llm model catalog
# Used by --list and --task presets.
# All text in English. Parameter recommendations cite provider sources.
#
# Sources:
#   Qwen3 sampling guide:     https://huggingface.co/Qwen/Qwen3.6-35B-A3B
#   Qwen3.5 model card:       https://huggingface.co/Qwen/Qwen3.5-4B
#   Qwen3-Coder-Next card:    https://huggingface.co/Qwen/Qwen3-Coder-Next
#   Qwen3.6-27B blog:         https://qwen.ai/blog?id=qwen3.6-27b
#   Gemma 4 model card:       https://ai.google.dev/gemma/docs/core/model_card_4
#   Gemma 4 26B HuggingFace:  https://huggingface.co/google/gemma-4-26B-A4B-it
#   Gemini 2.5 Flash docs:    https://docs.aimlapi.com/api-references/text-models-llm/google/gemini-2.5-flash
#   Gemini 2.5 Pro docs:      https://docs.aimlapi.com/api-references/text-models-llm/google/gemini-2.5-pro

models:
  qwen3.6-35b:
    type: local
    backend: exo (mac1+mac2, MLX 4bit DWQ)
    # Context: 262K native, up to 1010K extended
    # Source: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
    context_k: 262
    speed: slow
    strengths:
      - Reasoning, planning, step-by-step analysis
      - General work (commits, summaries, debugging)
      - Long nuanced responses
    recommended:
      # Non-thinking instruct mode: temp=0.7, top_p=0.8, top_k=20, presence_penalty=1.5
      # Source: https://huggingface.co/Qwen/Qwen3.6-35B-A3B (Instruct mode params)
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      max_tokens: 4096
    cost: free

  qwen3.6-27b:
    type: local
    backend: exo (mac1+mac2, MLX 4bit)
    # Context: 262K native, up to 1010K extended
    # Source: https://huggingface.co/Qwen/Qwen3.6-27B
    context_k: 262
    speed: medium
    strengths:
      - Flagship-level coding performance in a dense 27B model
      - Strong at code generation and general instruction following
      - Faster than 35B for interactive use
    recommended:
      # Non-thinking instruct mode: temp=0.7, top_p=0.8, top_k=20, presence_penalty=1.5
      # Source: https://qwen.ai/blog?id=qwen3.6-27b (aligned with Qwen3 instruct recommendations)
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      max_tokens: 4096
    cost: free

  qwen-coder-next:
    type: local
    backend: exo (mac1+mac2, MLX 4bit)
    # Qwen3-Coder-Next: MoE coding specialist
    # Recommended sampling: temperature=1.0, top_p=0.95, top_k=40
    # Source: https://huggingface.co/Qwen/Qwen3-Coder-Next
    context_k: 262
    speed: fast
    strengths:
      - Code generation, refactoring, debugging
      - Agentic coding tasks and tool use
      - Idiomatic, type-safe output
    recommended:
      # For thinking/code mode: temp=0.6 (precise), temp=1.0 (general)
      # Source: https://huggingface.co/Qwen/Qwen3-Coder-Next
      temperature: 0.6
      top_p: 0.95
      top_k: 40
      max_tokens: 8192
    cost: free

  qwen3.5-4b:
    type: local
    backend: exo (mac1+mac2, MLX 4bit OptiQ)
    # Context: 256K tokens
    # Source: https://huggingface.co/Qwen/Qwen3.5-4B
    context_k: 256
    speed: very fast
    strengths:
      - Quick answers, single-turn Q&A
      - Low-latency interactive use
      - Thinking disabled by default (instruct mode)
    recommended:
      # Non-thinking instruct mode: temp=0.7, top_p=0.8, top_k=20, presence_penalty=1.5
      # Source: https://huggingface.co/Qwen/Qwen3.5-4B (Qwen3.5 small models disable thinking by default)
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      max_tokens: 1024
    cost: free

  gemma-4:
    type: local
    backend: exo (mac1+mac2, MLX 4bit, MoE 26B A4B)
    # Gemma 4 26B A4B — 256K context, max output 32768 tokens
    # Source: https://huggingface.co/google/gemma-4-26B-A4B-it
    # Source: https://ai.google.dev/gemma/docs/core/model_card_4
    context_k: 256
    speed: fast
    strengths:
      - Creative writing, roleplay, dialogue
      - Multimodal tasks (vision capable)
      - Natural, varied language generation
    recommended:
      # Gemma 4 31B baseline benchmarked at temperature=1.0, top_p=0.95
      # Source: https://ai.google.dev/gemma/docs/core/model_card_4
      temperature: 1.0
      top_p: 0.95
      max_tokens: 8192
    cost: free

  gemini-2.5-flash:
    type: cloud
    backend: Google AI API (via LiteLLM)
    # Context: 1M tokens input, 65536 output
    # Source: https://docs.aimlapi.com/api-references/text-models-llm/google/gemini-2.5-flash
    context_k: 1048
    speed: fast
    strengths:
      - Summarization and extraction at scale
      - Long document analysis (1M context)
      - Cost-efficient for high-volume tasks
    recommended:
      # Temperature range 0-2, default 1. Use low temp for deterministic summarization.
      # Source: https://docs.aimlapi.com/api-references/text-models-llm/google/gemini-2.5-flash
      temperature: 0.4
      max_tokens: 8192
    cost: paid

  gemini-2.5-pro:
    type: cloud
    backend: Google AI API (via LiteLLM)
    # Context: 1M tokens input, 65536 output
    # Source: https://docs.aimlapi.com/api-references/text-models-llm/google/gemini-2.5-pro
    context_k: 1048
    speed: slow
    strengths:
      - Deep multi-document analysis
      - Complex reasoning over large corpora
      - Highest quality for research tasks
    recommended:
      # Temperature range 0-2. Use 0.5 for balanced analysis.
      # Source: https://docs.aimlapi.com/api-references/text-models-llm/google/gemini-2.5-pro
      temperature: 0.5
      max_tokens: 8192
    cost: paid

# Task presets — composable shorthand for --task <name>
# Model, temperature, max_tokens, and system-prompt are applied automatically.
# Override model with --model X, override temperature with --temperature X.
tasks:
  code:
    model: qwen-coder-next
    # Precise code gen: thinking mode with low temp for deterministic output
    # Source: https://huggingface.co/Qwen/Qwen3-Coder-Next (thinking mode + precise coding: temp=0.6)
    temperature: 0.6
    max_tokens: 8192
    system: "Precise code generation. Idiomatic, type-safe, minimal comments. Output ONLY code unless asked otherwise."

  reasoning:
    model: qwen3.6-35b
    # Reasoning tasks: standard non-thinking instruct at 0.7
    # Source: https://huggingface.co/Qwen/Qwen3.6-35B-A3B (Instruct mode)
    temperature: 0.7
    max_tokens: 4096
    system: "Step-by-step reasoning. Explicit assumptions. Mark uncertainties clearly."

  chat:
    model: qwen3.6-35b
    # Conversational: slightly above instruct default for natural flow
    temperature: 0.7
    max_tokens: 2048

  roleplay:
    model: gemma-4
    # Creative/roleplay: high temp for varied language, aligned with Gemma 4 baseline
    # Source: https://ai.google.dev/gemma/docs/core/model_card_4 (benchmarked at temp=1.0)
    temperature: 1.0
    max_tokens: 8192
    system: "Natural dialogue. Stay in character. Use varied, expressive language."

  summary:
    model: gemini-2.5-flash
    # Summarization: low temp for factual, deterministic output
    # Source: https://docs.aimlapi.com/api-references/text-models-llm/google/gemini-2.5-flash
    temperature: 0.4
    max_tokens: 2048
    system: "Concise summary. Key points only. Use bullets, not prose."

  analysis:
    model: gemini-2.5-pro
    # Deep analysis: moderate temp for balanced insight
    # Source: https://docs.aimlapi.com/api-references/text-models-llm/google/gemini-2.5-pro
    temperature: 0.5
    max_tokens: 8192
    system: "Thorough analysis against the full corpus provided. Cite sources and line numbers."

  quick:
    model: qwen3.5-4b
    # Fast single-turn: non-thinking instruct mode
    # Source: https://huggingface.co/Qwen/Qwen3.5-4B (thinking disabled by default in small models)
    temperature: 0.7
    max_tokens: 1024
    system: "Short, direct answer. One paragraph maximum."
