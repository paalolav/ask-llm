[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-llm"
version = "0.2.0"
description = "Thin CLI for OpenAI-compatible chat-completions endpoints (LiteLLM, Ollama, llama.cpp, mlx-lm, exo)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pal Olav Loftesnes" }]
dependencies = [
    "PyYAML>=5.4",
]

[project.optional-dependencies]
test = []

[project.scripts]
ask-llm = "ask_llm:main"

[project.urls]
Homepage = "https://github.com/paalolav/ask-llm"

[tool.setuptools.packages.find]
where = ["."]
include = ["ask_llm*"]

[tool.setuptools.package-data]
ask_llm = ["models.yaml"]
